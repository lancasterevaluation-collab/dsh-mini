<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>dsh-mini · 对话框</title>
<style>
  /* ============================================================
     设计令牌：一个地方定义，全站引用
     ============================================================ */
  :root {
    --bg: #0b0d12;
    --bg-soft: #12151d;
    --panel: #171b25;
    --panel-2: #1e2330;
    --line: #262c3a;
    --text: #e6e9f0;
    --text-dim: #8b93a7;
    --text-faint: #5f6779;
    --accent: #7c5cff;
    --accent-2: #4f8cff;
    --ok: #3ecf8e;
    --warn: #ffb84d;
    --err: #ff6b6b;
    --radius: 14px;
    --radius-sm: 9px;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    background:
      radial-gradient(1100px 620px at 12% -8%, #1d1840 0%, transparent 58%),
      radial-gradient(900px 520px at 92% 4%, #0e2a44 0%, transparent 52%),
      var(--bg);
    color: var(--text);
    font: 15px/1.65 "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  code, pre, .mono { font-family: "Cascadia Code", "JetBrains Mono", Consolas, ui-monospace, monospace; }

  /* ============================================================
     顶栏
     ============================================================ */
  header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 20px;
    border-bottom: 1px solid var(--line);
    background: rgba(15, 18, 26, 0.72);
    backdrop-filter: blur(12px);
    flex-wrap: wrap;
  }

  .brand { display: flex; align-items: center; gap: 9px; font-weight: 650; letter-spacing: .2px; }
  .dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--ok);
    box-shadow: 0 0 0 4px rgba(62, 207, 142, .14);
    transition: background .25s, box-shadow .25s;
  }
  body.busy .dot { background: var(--accent); box-shadow: 0 0 0 4px rgba(124, 92, 255, .18); animation: pulse 1.1s infinite; }
  @keyframes pulse { 50% { opacity: .45; } }

  .badge {
    font-size: 12px; padding: 3px 9px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--panel); color: var(--text-dim);
    white-space: nowrap;
  }
  .badge.accent { color: #cfc4ff; border-color: #3a2f6b; background: #211a44; }
  .badge.warn { color: #ffd9a0; border-color: #5a4526; background: #2c2415; }

  .spacer { flex: 1; }

  .stats { display: flex; gap: 14px; font-size: 12.5px; color: var(--text-faint); }
  .stats b { color: var(--text-dim); font-weight: 600; }

  button.ghost {
    font: inherit; font-size: 13px;
    color: var(--text-dim); background: var(--panel);
    border: 1px solid var(--line); border-radius: var(--radius-sm);
    padding: 5px 12px; cursor: pointer; transition: .16s;
  }
  button.ghost:hover { color: var(--text); border-color: #3a4356; background: var(--panel-2); }

  /* ============================================================
     消息区
     ============================================================ */
  main {
    flex: 1;
    overflow-y: auto;
    padding: 26px 20px 10px;
    scroll-behavior: smooth;
  }
  main::-webkit-scrollbar { width: 10px; }
  main::-webkit-scrollbar-thumb { background: #262c3a; border-radius: 10px; border: 3px solid transparent; background-clip: content-box; }
  main::-webkit-scrollbar-thumb:hover { background: #333c4e; background-clip: content-box; }

  .wrap { max-width: 880px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

  .row { display: flex; animation: rise .26s ease both; }
  @keyframes rise { from { opacity: 0; transform: translateY(7px); } }

  .row.me { justify-content: flex-end; }

  .bubble {
    max-width: 82%;
    padding: 11px 15px;
    border-radius: var(--radius);
    white-space: pre-wrap;
    word-break: break-word;
  }

  .me .bubble {
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
    color: #fff;
    border-bottom-right-radius: 4px;
    box-shadow: 0 6px 20px -8px rgba(124, 92, 255, .7);
  }

  .bot .bubble {
    background: var(--panel);
    border: 1px solid var(--line);
    border-bottom-left-radius: 4px;
  }

  /* ---- 过程卡片：工具 / 守卫 / 重试 ---- */
  .proc {
    max-width: 82%;
    font-size: 13px;
    border: 1px solid var(--line);
    border-left: 3px solid var(--text-faint);
    border-radius: var(--radius-sm);
    background: var(--bg-soft);
    overflow: hidden;
  }
  .proc.ok { border-left-color: var(--ok); }
  .proc.bad { border-left-color: var(--err); }
  .proc.guard { border-left-color: var(--warn); }
  .proc.retry { border-left-color: var(--accent); }

  .proc summary {
    cursor: pointer; padding: 7px 12px; list-style: none;
    display: flex; gap: 9px; align-items: center; color: var(--text-dim);
  }
  .proc summary::-webkit-details-marker { display: none; }
  .proc summary:hover { color: var(--text); background: rgba(255,255,255,.02); }
  .proc .tag { font-size: 11px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--text-faint); }
  .proc .name { color: #b9c2d6; font-weight: 600; }
  .proc .more { margin-left: auto; color: var(--text-faint); font-size: 11.5px; }
  .proc .body { padding: 0 12px 10px; color: var(--text-dim); border-top: 1px solid var(--line); padding-top: 9px; }
  .proc .body pre { margin: 0; white-space: pre-wrap; word-break: break-word; font-size: 12.5px; }

  /* ---- 状态提示（思考中 / 错误）---- */
  .notice { max-width: 82%; font-size: 13px; color: var(--text-faint); padding-left: 3px; }
  .notice.err { color: var(--err); }
  .thinking span { display: inline-block; animation: blink 1.3s infinite; }
  .thinking span:nth-child(2) { animation-delay: .18s; }
  .thinking span:nth-child(3) { animation-delay: .36s; }
  @keyframes blink { 0%, 60%, 100% { opacity: .25; } 30% { opacity: 1; } }

  /* ---- 空状态 ---- */
  .hero { text-align: center; padding: 40px 16px 8px; animation: rise .35s ease both; }
  .hero h1 { margin: 0 0 8px; font-size: 23px; font-weight: 650; letter-spacing: .2px; }
  .hero p { margin: 0; color: var(--text-faint); font-size: 13.5px; }
  .chips { display: flex; flex-wrap: wrap; gap: 9px; justify-content: center; margin-top: 20px; }
  .chip {
    font: inherit; font-size: 13px; cursor: pointer;
    color: var(--text-dim); background: var(--panel);
    border: 1px solid var(--line); border-radius: 999px; padding: 7px 15px; transition: .16s;
  }
  .chip:hover { color: var(--text); border-color: #3d4661; background: var(--panel-2); transform: translateY(-1px); }

  /* ============================================================
     输入区
     ============================================================ */
  footer { padding: 14px 20px 20px; }
  .composer {
    max-width: 880px; margin: 0 auto;
    display: flex; gap: 10px; align-items: flex-end;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 10px 10px 10px 15px;
    transition: border-color .18s, box-shadow .18s;
  }
  .composer:focus-within { border-color: #3d3a6b; box-shadow: 0 0 0 3px rgba(124,92,255,.12); }

  textarea {
    flex: 1; resize: none; border: none; outline: none; background: transparent;
    color: var(--text); font: inherit; max-height: 168px; min-height: 26px; line-height: 1.6;
  }
  textarea::placeholder { color: var(--text-faint); }

  button.send {
    font: inherit; font-weight: 600; color: #fff; cursor: pointer;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    border: none; border-radius: var(--radius-sm); padding: 9px 18px;
    transition: .16s; white-space: nowrap;
  }
  button.send:hover:not(:disabled) { filter: brightness(1.1); }
  button.send:disabled { opacity: .4; cursor: not-allowed; }

  .hint { max-width: 880px; margin: 8px auto 0; font-size: 12px; color: var(--text-faint); display: flex; gap: 14px; }
  kbd {
    font: inherit; font-size: 11px; padding: 1px 5px; border-radius: 5px;
    border: 1px solid var(--line); background: var(--bg-soft); color: var(--text-dim);
  }

  /* ---- 模式选择器 ---- */
  select.select {
    font: inherit; font-size: 13px;
    color: var(--text); background: var(--panel);
    border: 1px solid #3a2f6b; border-radius: var(--radius-sm);
    padding: 5px 10px; cursor: pointer; max-width: 210px;
  }
  select.select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(124,92,255,.14); }
  select.select option { background: #171b25; color: var(--text); }

  /* ---- 装配面板 ---- */
  .sheet-backdrop {
    position: fixed; inset: 0; background: rgba(4, 6, 11, .68);
    backdrop-filter: blur(3px); display: none; z-index: 40;
  }
  .sheet-backdrop.open { display: block; }

  .sheet {
    position: fixed; z-index: 41; right: 0; top: 0; bottom: 0;
    width: min(560px, 94vw);
    background: var(--bg-soft); border-left: 1px solid var(--line);
    box-shadow: -24px 0 60px -20px rgba(0,0,0,.7);
    transform: translateX(100%); transition: transform .24s ease;
    display: flex; flex-direction: column;
  }
  .sheet.open { transform: translateX(0); }

  .sheet-head {
    padding: 16px 20px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 10px;
  }
  .sheet-head h2 { margin: 0; font-size: 16px; font-weight: 650; }
  .sheet-body { flex: 1; overflow-y: auto; padding: 18px 20px; }
  .sheet-foot {
    padding: 14px 20px; border-top: 1px solid var(--line);
    display: flex; gap: 10px; align-items: center;
  }

  .field { margin-bottom: 18px; }
  .field > label { display: block; font-size: 12.5px; color: var(--text-dim); margin-bottom: 7px; font-weight: 600; }
  .field .hintline { font-size: 11.5px; color: var(--text-faint); margin-top: 5px; }

  input.text, textarea.text {
    width: 100%; font: inherit; font-size: 13px;
    color: var(--text); background: var(--panel);
    border: 1px solid var(--line); border-radius: var(--radius-sm);
    padding: 8px 11px; outline: none;
  }
  input.text:focus, textarea.text:focus { border-color: #3d3a6b; box-shadow: 0 0 0 3px rgba(124,92,255,.12); }
  textarea.text { resize: vertical; min-height: 120px; line-height: 1.55; }
  input[type="range"] { width: 100%; accent-color: var(--accent); }

  .toolgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .toolopt {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; color: var(--text-dim);
    background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius-sm); padding: 8px 11px; cursor: pointer;
    transition: .14s;
  }
  .toolopt:hover { border-color: #3d4661; color: var(--text); }
  .toolopt input { accent-color: var(--accent); }
  .toolopt.danger { border-color: #4a2d33; }
  .toolopt.danger input { accent-color: var(--err); }
  .toolopt .se { margin-left: auto; font-size: 10.5px; color: var(--text-faint); }

  button.primary {
    font: inherit; font-weight: 600; color: #fff; cursor: pointer;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    border: none; border-radius: var(--radius-sm); padding: 9px 18px;
  }
  button.primary:disabled { opacity: .45; cursor: not-allowed; }

  .modecard {
    border: 1px solid var(--line); border-radius: var(--radius-sm);
    padding: 11px 13px; margin-bottom: 9px; cursor: pointer; transition: .14s;
    background: var(--panel);
  }
  .modecard:hover { border-color: #3d4661; }
  .modecard.active { border-color: var(--accent); background: #1b1735; }
  .modecard .t { font-weight: 650; font-size: 13.5px; }
  .modecard .d { font-size: 12px; color: var(--text-faint); margin-top: 4px; line-height: 1.5; }

  .toast {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(10px);
    background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
    border-radius: 999px; padding: 9px 18px; font-size: 13px;
    opacity: 0; transition: .2s; pointer-events: none; z-index: 60;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.err { border-color: #5a2d33; color: #ffc9c9; }

  @media (max-width: 620px) {
    .bubble, .proc, .notice { max-width: 94%; }
    .stats { display: none; }
    .toolgrid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
  <header>
    <div class="brand"><span class="dot"></span> dsh-mini</div>
    <select id="select-mode" class="select" title="当前模式">
      <option>载入中…</option>
    </select>
    <span class="badge" id="badge-provider">连接中…</span>
    <span class="badge" id="badge-workspace" title="工作目录">—</span>
    <div class="spacer"></div>
    <div class="stats">
      <span>轮次 <b id="stat-turns">0</b></span>
      <span>步数 <b id="stat-steps">0</b></span>
      <span>工具 <b id="stat-tools">0</b></span>
      <span>守卫 <b id="stat-guard">0</b></span>
    </div>
    <button class="ghost" id="btn-assemble">装配</button>
    <button class="ghost" id="btn-reset">新会话</button>
  </header>

  <main id="main"><div class="wrap" id="wrap"></div></main>

  <footer>
    <div class="composer">
      <textarea id="input" rows="1" placeholder="说点什么…（Enter 发送，Shift+Enter 换行）"></textarea>
      <button class="send" id="btn-send">发送</button>
    </div>
    <div class="hint">
      <span><kbd>Enter</kbd> 发送</span>
      <span><kbd>Shift</kbd>+<kbd>Enter</kbd> 换行</span>
      <span id="hint-provider"></span>
    </div>
  </footer>

  <!-- 装配面板：勾选组件 → 存成一个自定义模式 -->
  <div class="sheet-backdrop" id="sheet-backdrop"></div>
  <aside class="sheet" id="sheet">
    <div class="sheet-head">
      <h2>装配模式</h2>
      <div class="spacer"></div>
      <button class="ghost" id="btn-close-sheet">关闭</button>
    </div>
    <div class="sheet-body">
      <div class="field">
        <label>以哪个模式为起点</label>
        <div id="mode-cards"></div>
        <div class="hintline">选一个之后，下面的工具与步数会换成它的；改完存成自己的模式</div>
      </div>
      <div class="field">
        <label>工具</label>
        <div class="toolgrid" id="tool-grid"></div>
        <div class="hintline">红框是不可逆操作（会要求人工审批）；spawn_agent 需要 multi-agent 插件</div>
      </div>
      <div class="field">
        <label>步数上限：<b id="steps-label">8</b></label>
        <input type="range" id="steps-range" min="1" max="24" value="8" />
      </div>
      <div class="field">
        <label>系统提示词</label>
        <textarea class="text" id="prompt-text" placeholder="给这个模式交代清楚它的职责与边界"></textarea>
        <div class="hintline">每轮都会进入模型上下文，尽量短</div>
      </div>
      <div class="field">
        <label>保存为自定义模式</label>
        <input class="text" id="custom-id" placeholder="id（小写字母、数字、连字符）" />
        <input class="text" id="custom-name" placeholder="显示名" style="margin-top:8px" />
        <input class="text" id="custom-desc" placeholder="一句话说明" style="margin-top:8px" />
        <div class="hintline">落盘到 modes/custom-&lt;id&gt;.json 与 prompts/custom-&lt;id&gt;.md —— 可以发给别人</div>
      </div>
    </div>
    <div class="sheet-foot">
      <button class="primary" id="btn-save-mode">保存并启用</button>
      <span class="hintline" id="save-hint"></span>
    </div>
  </aside>

  <div class="toast" id="toast"></div>

<script>
// ============================================================
// 状态
// ============================================================
const state = { running: false, provider: '?', mode: 'standard', hasMessages: false }

const els = {
  wrap: document.getElementById('wrap'),
  main: document.getElementById('main'),
  input: document.getElementById('input'),
  send: document.getElementById('btn-send'),
  reset: document.getElementById('btn-reset'),
  provider: document.getElementById('badge-provider'),
  workspace: document.getElementById('badge-workspace'),
  hint: document.getElementById('hint-provider'),
  turns: document.getElementById('stat-turns'),
  steps: document.getElementById('stat-steps'),
  tools: document.getElementById('stat-tools'),
  guard: document.getElementById('stat-guard'),
}

// ============================================================
// 渲染原语
//
// ★ 全部用 textContent，绝不用 innerHTML 拼内容 ★
// 因为助手回答和工具输出都是**外部数据**（模型与文件产生），
// 一旦用 innerHTML，一个工具结果里的 <script> 就能变成真的脚本。
// 这是本文件唯一的"安全红线"。
// ============================================================

/** 造一个元素。 */
function el(tag, className, text) {
  const node = document.createElement(tag)
  if (className) node.className = className
  if (text !== undefined) node.textContent = text
  return node
}

/** 滚到底部。 */
function scrollDown() {
  els.main.scrollTop = els.main.scrollHeight
}

/** 清掉空状态。 */
function clearHero() {
  if (!state.hasMessages) {
    els.wrap.replaceChildren()
    state.hasMessages = true
  }
}

/** 用户气泡。 */
function addUser(text) {
  clearHero()
  const row = el('div', 'row me')
  row.appendChild(el('div', 'bubble', text))
  els.wrap.appendChild(row)
  scrollDown()
}

/** 助手气泡。 */
function addAssistant(text) {
  clearHero()
  const row = el('div', 'row bot')
  row.appendChild(el('div', 'bubble', text))
  els.wrap.appendChild(row)
  scrollDown()
}

/** 过程卡片（工具 / 守卫 / 重试）。 */
function addProc(kind, label, summary, detail) {
  clearHero()
  const row = el('div', 'row')
  const card = el('details', 'proc ' + kind)
  const head = el('summary')
  head.appendChild(el('span', 'name', label))
  if (summary) head.appendChild(el('span', 'tag', summary))
  head.appendChild(el('span', 'more', '详情'))
  card.appendChild(head)
  const body = el('div', 'body')
  body.appendChild(el('pre', null, detail || '（无更多内容）'))
  card.appendChild(body)
  row.appendChild(card)
  els.wrap.appendChild(row)
  scrollDown()
}

/** 一行灰字提示。 */
function addNotice(text, isError) {
  clearHero()
  const row = el('div', 'row')
  row.appendChild(el('div', 'notice' + (isError ? ' err' : ''), text))
  els.wrap.appendChild(row)
  scrollDown()
}

/** 思考中（可被移除）。 */
let thinkingNode = null
function showThinking() {
  clearHero()
  if (thinkingNode) return
  const row = el('div', 'row')
  const box = el('div', 'notice thinking')
  box.append(el('span', null, '●'), el('span', null, '●'), el('span', null, '●'))
  box.append(el('span', null, ' 正在处理…'))
  row.appendChild(box)
  els.wrap.appendChild(row)
  thinkingNode = row
  scrollDown()
}
function hideThinking() {
  if (thinkingNode) { thinkingNode.remove(); thinkingNode = null }
}

/** 更新顶栏统计。 */
function applyState(s) {
  state.provider = s.provider
  state.mode = s.mode
  const select = document.getElementById('select-mode')
  if (select !== null && typeof s.mode === 'string' && s.mode !== '') select.value = s.mode
  els.provider.textContent = s.provider === 'local' ? '离线规则' : s.provider === 'mock' ? 'mock 脚本' : s.model
  els.provider.className = 'badge' + (s.provider === 'local' ? ' warn' : s.provider === 'deepseek' ? ' accent' : '')
  els.workspace.textContent = s.workspace
  els.turns.textContent = s.turns
  els.steps.textContent = s.steps
  els.tools.textContent = s.toolCalls + (s.toolErrors > 0 ? '（' + s.toolErrors + ' 失败）' : '')
  els.guard.textContent = s.guardDenials + s.guardAsks
  els.hint.textContent = s.provider === 'local'
    ? '离线规则模式：只认几条关键词。设 DEEPSEEK_API_KEY 后换 profiles/chat-deepseek.json'
    : ''
}

/** 空状态 + 示例问题。 */
function renderHero() {
  const hero = el('div', 'hero')
  hero.appendChild(el('h1', null, '有什么可以帮你的？'))
  hero.appendChild(el('p', null, '这是一个 DSH 级插件化 agent harness 的图形界面'))
  const chips = el('div', 'chips')
  for (const text of ['看看这个目录里有什么', '读一下 notes.txt', '介绍这个项目', '帮助']) {
    const chip = el('button', 'chip', text)
    chip.addEventListener('click', () => { els.input.value = text; send() })
    chips.appendChild(chip)
  }
  hero.appendChild(chips)
  els.wrap.appendChild(hero)
}

/** 忙碌状态切换。 */
function setBusy(busy) {
  state.running = busy
  document.body.classList.toggle('busy', busy)
  els.send.disabled = busy
  els.input.disabled = busy
  if (busy) showThinking(); else hideThinking()
}

// ============================================================
// 与后端通信
// ============================================================

/** 处理一条服务端消息。 */
function onMessage(msg) {
  switch (msg.type) {
    case 'hello':
      return applyState(msg.state)
    case 'state':
      return applyState(msg.state)
    case 'user':
      return // 本地已经回显过了，避免重复
    case 'running':
      return setBusy(true)
    case 'assistant':
      hideThinking()
      return addAssistant(msg.text)
    case 'tool':
      return addProc(msg.isError ? 'bad' : 'ok', '⚙ ' + msg.name, msg.isError ? '失败' : '成功', msg.summary)
    case 'guard':
      return addProc('guard', '🛡 守卫拦下', msg.rule, msg.detail)
    case 'retry':
      return addProc('retry', '↻ 重试第 ' + msg.attempt + ' 次', msg.code, msg.message)
    case 'task-end':
      setBusy(false)
      return
    case 'error':
      setBusy(false)
      return addNotice('出错：' + msg.message, true)
    default:
      return
  }
}

/** 建立 SSE 连接（断线自动重连由 EventSource 负责）。 */
function connect() {
  const source = new EventSource('/api/events')
  source.addEventListener('message', (event) => {
    try { onMessage(JSON.parse(event.data)) } catch { /* 坏消息忽略，别让界面挂掉 */ }
  })
  source.addEventListener('error', () => {
    els.provider.textContent = '连接断开，重连中…'
    els.provider.className = 'badge warn'
  })
}

/** 发一条消息。 */
async function send() {
  const text = els.input.value.trim()
  if (text === '' || state.running) return

  addUser(text)
  els.input.value = ''
  autosize()
  setBusy(true)

  try {
    const response = await fetch('/api/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text }),
    })
    if (!response.ok) {
      const detail = await response.json().catch(() => ({}))
      setBusy(false)
      addNotice('发送失败：' + (detail.error || response.status), true)
    }
    // 成功时（202）什么都不用做：结果会从 SSE 回来
  } catch (error) {
    setBusy(false)
    addNotice('发送失败：' + error.message, true)
  }
}

/** 输入框自适应高度。 */
function autosize() {
  els.input.style.height = 'auto'
  els.input.style.height = Math.min(els.input.scrollHeight, 168) + 'px'
}

// ============================================================
// 事件绑定
// ============================================================
els.input.addEventListener('input', autosize)
els.input.addEventListener('keydown', (event) => {
  if (event.key === 'Enter' && !event.shiftKey) {
    event.preventDefault()
    send()
  }
})
els.send.addEventListener('click', send)

els.reset.addEventListener('click', async () => {
  if (state.running) return
  try {
    const response = await fetch('/api/reset', { method: 'POST' })
    if (response.ok) {
      els.wrap.replaceChildren()
      state.hasMessages = false
      renderHero()
      applyState(await response.json())
    }
  } catch { /* 重置失败时保留原界面 */ }
})

renderHero()
connect()
els.input.focus()

// ============================================================
// 模式与装配
//
// ★ 装配的落点是**文件**（modes/*.json），不是浏览器里的状态 ★
// 所以"保存"这个动作是往磁盘写一份新模式 —— 于是用户装出来的东西
// 和内置模式格式完全一致，可以用来启动 CLI、可以发给人、可以进版本库。
// ============================================================

const modeSelect = document.getElementById('select-mode')
const sheetEl = document.getElementById('sheet')
const backdropEl = document.getElementById('sheet-backdrop')
const toolGrid = document.getElementById('tool-grid')
const modeCards = document.getElementById('mode-cards')
const stepsRange = document.getElementById('steps-range')
const stepsLabel = document.getElementById('steps-label')
const promptArea = document.getElementById('prompt-text')
const toastEl = document.getElementById('toast')

let modesCache = []
let toolsCache = []
let draftFrom = 'standard'

/** 一条轻提示。 */
function toast(message, isError) {
  toastEl.textContent = message
  toastEl.className = 'toast show' + (isError ? ' err' : '')
  setTimeout(() => { toastEl.className = 'toast' }, 2800)
}

/** 拉模式列表，填充顶栏下拉与面板卡片。 */
async function refreshModes() {
  try {
    modesCache = await (await fetch('/api/modes')).json()
  } catch {
    return
  }

  modeSelect.replaceChildren(...modesCache.map((mode) => {
    const option = document.createElement('option')
    option.value = mode.id
    option.textContent = mode.name
    option.title = mode.description
    return option
  }))
  modeSelect.value = state.mode

  modeCards.replaceChildren(...modesCache.map((mode) => {
    const card = el('div', 'modecard' + (mode.id === draftFrom ? ' active' : ''))
    card.appendChild(el('div', 't', mode.name))
    card.appendChild(el('div', 'd', mode.description))
    card.addEventListener('click', () => { draftFrom = mode.id; fillDraft(); refreshModes() })
    return card
  }))

  if (toolsCache.length === 0) {
    try { toolsCache = await (await fetch('/api/tools')).json() } catch { toolsCache = [] }
  }
}

/** 按"起点模式"填充面板其它字段。 */
function fillDraft() {
  const mode = modesCache.find((item) => item.id === draftFrom)
  if (mode === undefined) return

  toolGrid.replaceChildren(...toolsCache.map((tool) => {
    const label = el('label', 'toolopt' + (tool.sideEffect === 'irreversible' ? ' danger' : ''))
    const box = document.createElement('input')
    box.type = 'checkbox'
    box.value = tool.name
    box.checked = mode.tools.includes(tool.name)
    box.dataset.tool = tool.name
    label.appendChild(box)
    label.appendChild(el('span', null, tool.name))
    label.appendChild(el('span', 'se', tool.sideEffect === 'irreversible' ? '不可逆' : tool.sideEffect === 'none' ? '只读' : '可逆'))
    label.title = tool.summary
    return label
  }))

  stepsRange.value = String(mode.maxSteps ?? 8)
  stepsLabel.textContent = stepsRange.value
  promptArea.value = mode.promptText ?? ''

  document.getElementById('custom-id').value = ''
  document.getElementById('custom-name').value = `${mode.name}（自定义）`
  document.getElementById('custom-desc').value = `基于 ${mode.name} 的自定义装配`
  document.getElementById('save-hint').textContent = `起点：${mode.id}`
}

/** 打开/关闭面板。 */
function openSheet() {
  backdropEl.classList.add('open')
  sheetEl.classList.add('open')
  void refreshModes().then(fillDraft)
}
function closeSheet() {
  backdropEl.classList.remove('open')
  sheetEl.classList.remove('open')
}

/** 切换模式。 */
async function switchMode(id) {
  try {
    const response = await fetch('/api/mode', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id }),
    })
    const payload = await response.json()
    if (!response.ok) {
      toast('切换失败：' + (payload.error || response.status), true)
      await refreshModes()
      return
    }
    applyState(payload)
    els.wrap.replaceChildren()
    state.hasMessages = false
    renderHero()
    toast(`已切到「${payload.modeName}」，工具：${payload.modeTools.join(', ')}`)
  } catch (error) {
    toast('切换失败：' + error.message, true)
  }
}

/** 保存自定义模式并启用。 */
async function saveCustomMode() {
  const tools = [...toolGrid.querySelectorAll('input[type="checkbox"]')]
    .filter((box) => box.checked)
    .map((box) => box.value)

  if (tools.length === 0) {
    toast('至少要勾一个工具', true)
    return
  }

  const button = document.getElementById('btn-save-mode')
  button.disabled = true
  try {
    const response = await fetch('/api/custom-mode', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        id: document.getElementById('custom-id').value,
        name: document.getElementById('custom-name').value,
        description: document.getElementById('custom-desc').value,
        tools,
        maxSteps: Number(stepsRange.value),
        promptText: promptArea.value,
      }),
    })
    const payload = await response.json()
    if (!response.ok) {
      toast('保存失败：' + (payload.error || response.status), true)
      return
    }
    applyState(payload.state)
    await refreshModes()
    closeSheet()
    els.wrap.replaceChildren()
    state.hasMessages = false
    renderHero()
    toast(`已保存并启用模式 ${payload.id}`)
  } catch (error) {
    toast('保存失败：' + error.message, true)
  } finally {
    button.disabled = false
  }
}

modeSelect.addEventListener('change', () => { void switchMode(modeSelect.value) })
document.getElementById('btn-assemble').addEventListener('click', openSheet)
document.getElementById('btn-close-sheet').addEventListener('click', closeSheet)
backdropEl.addEventListener('click', closeSheet)
stepsRange.addEventListener('input', () => { stepsLabel.textContent = stepsRange.value })
document.getElementById('btn-save-mode').addEventListener('click', () => { void saveCustomMode() })

void refreshModes()
</script>
</body>
</html>
