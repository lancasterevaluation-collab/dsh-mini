<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>dsh-mini · 对话框</title>
<style>
  /* ============================================================
     设计令牌：一个地方定义，全站引用
     ============================================================ */
  :root {
    --bg: #0b0d12;
    --bg-soft: #12151d;
    --panel: #171b25;
    --panel-2: #1e2330;
    --line: #262c3a;
    --text: #e6e9f0;
    --text-dim: #8b93a7;
    --text-faint: #5f6779;
    --accent: #7c5cff;
    --accent-2: #4f8cff;
    --ok: #3ecf8e;
    --warn: #ffb84d;
    --err: #ff6b6b;
    --radius: 14px;
    --radius-sm: 9px;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    background:
      radial-gradient(1100px 620px at 12% -8%, #1d1840 0%, transparent 58%),
      radial-gradient(900px 520px at 92% 4%, #0e2a44 0%, transparent 52%),
      var(--bg);
    color: var(--text);
    font: 15px/1.65 "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  code, pre, .mono { font-family: "Cascadia Code", "JetBrains Mono", Consolas, ui-monospace, monospace; }

  /* ============================================================
     顶栏
     ============================================================ */
  header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 20px;
    border-bottom: 1px solid var(--line);
    background: rgba(15, 18, 26, 0.72);
    backdrop-filter: blur(12px);
    flex-wrap: wrap;
  }

  .brand { display: flex; align-items: center; gap: 9px; font-weight: 650; letter-spacing: .2px; }
  .dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--ok);
    box-shadow: 0 0 0 4px rgba(62, 207, 142, .14);
    transition: background .25s, box-shadow .25s;
  }
  body.busy .dot { background: var(--accent); box-shadow: 0 0 0 4px rgba(124, 92, 255, .18); animation: pulse 1.1s infinite; }
  @keyframes pulse { 50% { opacity: .45; } }

  .badge {
    font-size: 12px; padding: 3px 9px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--panel); color: var(--text-dim);
    white-space: nowrap;
  }
  .badge.accent { color: #cfc4ff; border-color: #3a2f6b; background: #211a44; }
  .badge.warn { color: #ffd9a0; border-color: #5a4526; background: #2c2415; }

  .spacer { flex: 1; }

  .stats { display: flex; gap: 14px; font-size: 12.5px; color: var(--text-faint); }
  .stats b { color: var(--text-dim); font-weight: 600; }

  button.ghost {
    font: inherit; font-size: 13px;
    color: var(--text-dim); background: var(--panel);
    border: 1px solid var(--line); border-radius: var(--radius-sm);
    padding: 5px 12px; cursor: pointer; transition: .16s;
  }
  button.ghost:hover { color: var(--text); border-color: #3a4356; background: var(--panel-2); }

  /* ============================================================
     消息区
     ============================================================ */
  main {
    flex: 1;
    overflow-y: auto;
    padding: 26px 20px 10px;
    scroll-behavior: smooth;
  }
  main::-webkit-scrollbar { width: 10px; }
  main::-webkit-scrollbar-thumb { background: #262c3a; border-radius: 10px; border: 3px solid transparent; background-clip: content-box; }
  main::-webkit-scrollbar-thumb:hover { background: #333c4e; background-clip: content-box; }

  .wrap { max-width: 880px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

  .row { display: flex; animation: rise .26s ease both; }
  @keyframes rise { from { opacity: 0; transform: translateY(7px); } }

  .row.me { justify-content: flex-end; }

  .bubble {
    max-width: 82%;
    padding: 11px 15px;
    border-radius: var(--radius);
    white-space: pre-wrap;
    word-break: break-word;
  }

  .me .bubble {
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
    color: #fff;
    border-bottom-right-radius: 4px;
    box-shadow: 0 6px 20px -8px rgba(124, 92, 255, .7);
  }

  .bot .bubble {
    background: var(--panel);
    border: 1px solid var(--line);
    border-bottom-left-radius: 4px;
  }

  /* ---- 过程卡片：工具 / 守卫 / 重试 ---- */
  .proc {
    max-width: 82%;
    font-size: 13px;
    border: 1px solid var(--line);
    border-left: 3px solid var(--text-faint);
    border-radius: var(--radius-sm);
    background: var(--bg-soft);
    overflow: hidden;
  }
  .proc.ok { border-left-color: var(--ok); }
  .proc.bad { border-left-color: var(--err); }
  .proc.guard { border-left-color: var(--warn); }
  .proc.retry { border-left-color: var(--accent); }

  .proc summary {
    cursor: pointer; padding: 7px 12px; list-style: none;
    display: flex; gap: 9px; align-items: center; color: var(--text-dim);
  }
  .proc summary::-webkit-details-marker { display: none; }
  .proc summary:hover { color: var(--text); background: rgba(255,255,255,.02); }
  .proc .tag { font-size: 11px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--text-faint); }
  .proc .name { color: #b9c2d6; font-weight: 600; }
  .proc .more { margin-left: auto; color: var(--text-faint); font-size: 11.5px; }
  .proc .body { padding: 0 12px 10px; color: var(--text-dim); border-top: 1px solid var(--line); padding-top: 9px; }
  .proc .body pre { margin: 0; white-space: pre-wrap; word-break: break-word; font-size: 12.5px; }

  /* ---- 状态提示（思考中 / 错误）---- */
  .notice { max-width: 82%; font-size: 13px; color: var(--text-faint); padding-left: 3px; }
  .notice.err { color: var(--err); }
  .thinking span { display: inline-block; animation: blink 1.3s infinite; }
  .thinking span:nth-child(2) { animation-delay: .18s; }
  .thinking span:nth-child(3) { animation-delay: .36s; }
  @keyframes blink { 0%, 60%, 100% { opacity: .25; } 30% { opacity: 1; } }

  /* ---- 空状态 ---- */
  .hero { text-align: center; padding: 40px 16px 8px; animation: rise .35s ease both; }
  .hero h1 { margin: 0 0 8px; font-size: 23px; font-weight: 650; letter-spacing: .2px; }
  .hero p { margin: 0; color: var(--text-faint); font-size: 13.5px; }
  .chips { display: flex; flex-wrap: wrap; gap: 9px; justify-content: center; margin-top: 20px; }
  .chip {
    font: inherit; font-size: 13px; cursor: pointer;
    color: var(--text-dim); background: var(--panel);
    border: 1px solid var(--line); border-radius: 999px; padding: 7px 15px; transition: .16s;
  }
  .chip:hover { color: var(--text); border-color: #3d4661; background: var(--panel-2); transform: translateY(-1px); }

  /* ============================================================
     输入区
     ============================================================ */
  footer { padding: 14px 20px 20px; }
  .composer {
    max-width: 880px; margin: 0 auto;
    display: flex; gap: 10px; align-items: flex-end;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 10px 10px 10px 15px;
    transition: border-color .18s, box-shadow .18s;
  }
  .composer:focus-within { border-color: #3d3a6b; box-shadow: 0 0 0 3px rgba(124,92,255,.12); }

  textarea {
    flex: 1; resize: none; border: none; outline: none; background: transparent;
    color: var(--text); font: inherit; max-height: 168px; min-height: 26px; line-height: 1.6;
  }
  textarea::placeholder { color: var(--text-faint); }

  button.send {
    font: inherit; font-weight: 600; color: #fff; cursor: pointer;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    border: none; border-radius: var(--radius-sm); padding: 9px 18px;
    transition: .16s; white-space: nowrap;
  }
  button.send:hover:not(:disabled) { filter: brightness(1.1); }
  button.send:disabled { opacity: .4; cursor: not-allowed; }

  .hint { max-width: 880px; margin: 8px auto 0; font-size: 12px; color: var(--text-faint); display: flex; gap: 14px; }
  kbd {
    font: inherit; font-size: 11px; padding: 1px 5px; border-radius: 5px;
    border: 1px solid var(--line); background: var(--bg-soft); color: var(--text-dim);
  }

  @media (max-width: 620px) {
    .bubble, .proc, .notice { max-width: 94%; }
    .stats { display: none; }
  }
</style>
</head>
<body>
  <header>
    <div class="brand"><span class="dot"></span> dsh-mini</div>
    <span class="badge" id="badge-provider">连接中…</span>
    <span class="badge" id="badge-workspace">—</span>
    <div class="spacer"></div>
    <div class="stats">
      <span>轮次 <b id="stat-turns">0</b></span>
      <span>步数 <b id="stat-steps">0</b></span>
      <span>工具 <b id="stat-tools">0</b></span>
      <span>守卫 <b id="stat-guard">0</b></span>
    </div>
    <button class="ghost" id="btn-reset">新会话</button>
  </header>

  <main id="main"><div class="wrap" id="wrap"></div></main>

  <footer>
    <div class="composer">
      <textarea id="input" rows="1" placeholder="说点什么…（Enter 发送，Shift+Enter 换行）"></textarea>
      <button class="send" id="btn-send">发送</button>
    </div>
    <div class="hint">
      <span><kbd>Enter</kbd> 发送</span>
      <span><kbd>Shift</kbd>+<kbd>Enter</kbd> 换行</span>
      <span id="hint-provider"></span>
    </div>
  </footer>

<script>
// ============================================================
// 状态
// ============================================================
const state = { running: false, provider: '?', hasMessages: false }

const els = {
  wrap: document.getElementById('wrap'),
  main: document.getElementById('main'),
  input: document.getElementById('input'),
  send: document.getElementById('btn-send'),
  reset: document.getElementById('btn-reset'),
  provider: document.getElementById('badge-provider'),
  workspace: document.getElementById('badge-workspace'),
  hint: document.getElementById('hint-provider'),
  turns: document.getElementById('stat-turns'),
  steps: document.getElementById('stat-steps'),
  tools: document.getElementById('stat-tools'),
  guard: document.getElementById('stat-guard'),
}

// ============================================================
// 渲染原语
//
// ★ 全部用 textContent，绝不用 innerHTML 拼内容 ★
// 因为助手回答和工具输出都是**外部数据**（模型与文件产生），
// 一旦用 innerHTML，一个工具结果里的 <script> 就能变成真的脚本。
// 这是本文件唯一的"安全红线"。
// ============================================================

/** 造一个元素。 */
function el(tag, className, text) {
  const node = document.createElement(tag)
  if (className) node.className = className
  if (text !== undefined) node.textContent = text
  return node
}

/** 滚到底部。 */
function scrollDown() {
  els.main.scrollTop = els.main.scrollHeight
}

/** 清掉空状态。 */
function clearHero() {
  if (!state.hasMessages) {
    els.wrap.replaceChildren()
    state.hasMessages = true
  }
}

/** 用户气泡。 */
function addUser(text) {
  clearHero()
  const row = el('div', 'row me')
  row.appendChild(el('div', 'bubble', text))
  els.wrap.appendChild(row)
  scrollDown()
}

/** 助手气泡。 */
function addAssistant(text) {
  clearHero()
  const row = el('div', 'row bot')
  row.appendChild(el('div', 'bubble', text))
  els.wrap.appendChild(row)
  scrollDown()
}

/** 过程卡片（工具 / 守卫 / 重试）。 */
function addProc(kind, label, summary, detail) {
  clearHero()
  const row = el('div', 'row')
  const card = el('details', 'proc ' + kind)
  const head = el('summary')
  head.appendChild(el('span', 'name', label))
  if (summary) head.appendChild(el('span', 'tag', summary))
  head.appendChild(el('span', 'more', '详情'))
  card.appendChild(head)
  const body = el('div', 'body')
  body.appendChild(el('pre', null, detail || '（无更多内容）'))
  card.appendChild(body)
  row.appendChild(card)
  els.wrap.appendChild(row)
  scrollDown()
}

/** 一行灰字提示。 */
function addNotice(text, isError) {
  clearHero()
  const row = el('div', 'row')
  row.appendChild(el('div', 'notice' + (isError ? ' err' : ''), text))
  els.wrap.appendChild(row)
  scrollDown()
}

/** 思考中（可被移除）。 */
let thinkingNode = null
function showThinking() {
  clearHero()
  if (thinkingNode) return
  const row = el('div', 'row')
  const box = el('div', 'notice thinking')
  box.append(el('span', null, '●'), el('span', null, '●'), el('span', null, '●'))
  box.append(el('span', null, ' 正在处理…'))
  row.appendChild(box)
  els.wrap.appendChild(row)
  thinkingNode = row
  scrollDown()
}
function hideThinking() {
  if (thinkingNode) { thinkingNode.remove(); thinkingNode = null }
}

/** 更新顶栏统计。 */
function applyState(s) {
  state.provider = s.provider
  els.provider.textContent = s.provider === 'local' ? '离线规则' : s.provider === 'mock' ? 'mock 脚本' : s.model
  els.provider.className = 'badge' + (s.provider === 'local' ? ' warn' : s.provider === 'deepseek' ? ' accent' : '')
  els.workspace.textContent = s.workspace
  els.turns.textContent = s.turns
  els.steps.textContent = s.steps
  els.tools.textContent = s.toolCalls + (s.toolErrors > 0 ? '（' + s.toolErrors + ' 失败）' : '')
  els.guard.textContent = s.guardDenials + s.guardAsks
  els.hint.textContent = s.provider === 'local'
    ? '离线规则模式：只认几条关键词。设 DEEPSEEK_API_KEY 后换 profiles/chat-deepseek.json'
    : ''
}

/** 空状态 + 示例问题。 */
function renderHero() {
  const hero = el('div', 'hero')
  hero.appendChild(el('h1', null, '有什么可以帮你的？'))
  hero.appendChild(el('p', null, '这是一个 DSH 级插件化 agent harness 的图形界面'))
  const chips = el('div', 'chips')
  for (const text of ['看看这个目录里有什么', '读一下 notes.txt', '介绍这个项目', '帮助']) {
    const chip = el('button', 'chip', text)
    chip.addEventListener('click', () => { els.input.value = text; send() })
    chips.appendChild(chip)
  }
  hero.appendChild(chips)
  els.wrap.appendChild(hero)
}

/** 忙碌状态切换。 */
function setBusy(busy) {
  state.running = busy
  document.body.classList.toggle('busy', busy)
  els.send.disabled = busy
  els.input.disabled = busy
  if (busy) showThinking(); else hideThinking()
}

// ============================================================
// 与后端通信
// ============================================================

/** 处理一条服务端消息。 */
function onMessage(msg) {
  switch (msg.type) {
    case 'hello':
      return applyState(msg.state)
    case 'state':
      return applyState(msg.state)
    case 'user':
      return // 本地已经回显过了，避免重复
    case 'running':
      return setBusy(true)
    case 'assistant':
      hideThinking()
      return addAssistant(msg.text)
    case 'tool':
      return addProc(msg.isError ? 'bad' : 'ok', '⚙ ' + msg.name, msg.isError ? '失败' : '成功', msg.summary)
    case 'guard':
      return addProc('guard', '🛡 守卫拦下', msg.rule, msg.detail)
    case 'retry':
      return addProc('retry', '↻ 重试第 ' + msg.attempt + ' 次', msg.code, msg.message)
    case 'task-end':
      setBusy(false)
      return
    case 'error':
      setBusy(false)
      return addNotice('出错：' + msg.message, true)
    default:
      return
  }
}

/** 建立 SSE 连接（断线自动重连由 EventSource 负责）。 */
function connect() {
  const source = new EventSource('/api/events')
  source.addEventListener('message', (event) => {
    try { onMessage(JSON.parse(event.data)) } catch { /* 坏消息忽略，别让界面挂掉 */ }
  })
  source.addEventListener('error', () => {
    els.provider.textContent = '连接断开，重连中…'
    els.provider.className = 'badge warn'
  })
}

/** 发一条消息。 */
async function send() {
  const text = els.input.value.trim()
  if (text === '' || state.running) return

  addUser(text)
  els.input.value = ''
  autosize()
  setBusy(true)

  try {
    const response = await fetch('/api/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text }),
    })
    if (!response.ok) {
      const detail = await response.json().catch(() => ({}))
      setBusy(false)
      addNotice('发送失败：' + (detail.error || response.status), true)
    }
    // 成功时（202）什么都不用做：结果会从 SSE 回来
  } catch (error) {
    setBusy(false)
    addNotice('发送失败：' + error.message, true)
  }
}

/** 输入框自适应高度。 */
function autosize() {
  els.input.style.height = 'auto'
  els.input.style.height = Math.min(els.input.scrollHeight, 168) + 'px'
}

// ============================================================
// 事件绑定
// ============================================================
els.input.addEventListener('input', autosize)
els.input.addEventListener('keydown', (event) => {
  if (event.key === 'Enter' && !event.shiftKey) {
    event.preventDefault()
    send()
  }
})
els.send.addEventListener('click', send)

els.reset.addEventListener('click', async () => {
  if (state.running) return
  try {
    const response = await fetch('/api/reset', { method: 'POST' })
    if (response.ok) {
      els.wrap.replaceChildren()
      state.hasMessages = false
      renderHero()
      applyState(await response.json())
    }
  } catch { /* 重置失败时保留原界面 */ }
})

renderHero()
connect()
els.input.focus()
</script>
</body>
</html>
